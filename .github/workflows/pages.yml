# Builds the documentation site with go-mx itself (tools/gen-docs-site) and
# deploys it to GitHub Pages at https://ungerik.github.io/go-mx/. The site is
# never committed: a push to main builds and deploys it, a pull request only
# builds it, which checks that every page renders, every example snapshot and
# the gallery are written, and every internal link resolves.
#
# Needs the repository's Pages source set to GitHub Actions:
#
#   gh api -X PUT repos/ungerik/go-mx/pages -f build_type=workflow

name: Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a running one is never cancelled, so the site
# cannot end up half replaced. Pull request builds get a group per branch and
# give way to a newer push.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # The whole history: each page's published and last-updated dates
        # (sitemap, Open Graph, Markdown alternates) come from git log.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Configure Pages
      id: pages
      if: github.event_name != 'pull_request'
      uses: actions/configure-pages@v6

    # Renders the Markdown, the gallery (go run ./cmd/shadcn-gallery) and the
    # example snapshots (go run ./cmd/example-… -snapshot), then checks every
    # internal link. The base URL Pages reports wins over the default, so a
    # custom domain needs no change here.
    - name: Build site
      env:
        BASE_URL: ${{ steps.pages.outputs.base_url }}
      run: go -C tools run ./gen-docs-site -out ../_site ${BASE_URL:+-base-url "$BASE_URL/"}

    - name: Upload site
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
