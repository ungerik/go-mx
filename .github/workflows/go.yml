# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'

    # go test ./... only covers the current module even in workspace mode, so
    # each nested module needs its own step.
    - name: Build
      run: go build -v ./...

    # The browser tests of the shadcn inline scripts run in the runner's
    # preinstalled Chrome (internal/headless); MX_REQUIRE_CHROME fails them
    # rather than skipping them when it is missing.
    - name: Test
      run: go test -v ./...
      env:
        MX_REQUIRE_CHROME: "1"

    - name: Test mcp module
      run: go test -C mcp -v ./...

    - name: Build tools module
      run: go build -C tools ./...

    # -short skips TestBuildRepository, the full site build with the gallery
    # and the example snapshots: the Pages workflow runs that build itself.
    - name: Test tools module
      run: go test -C tools -short ./...

    # The go-enum methods are committed next to their //#enum types; -validate
    # fails if any are missing or outdated. ../... covers the root module but
    # stops at nested modules, so each of them gets its own run.
    - name: Enum methods up to date
      run: |
        go -C tools tool go-enum -validate ../...
        go -C tools tool go-enum -validate ../mcp/...
